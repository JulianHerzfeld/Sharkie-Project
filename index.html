<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <link rel="icon" type="image/x-icon" href="icons/favicon-32x32.png">

    <script src="js/mobile.js"></script>
    <script src="models/audio-manager.class.js"></script>
    <script src="js/audio.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/poison.class.js"></script>
    <script src="models/world.class.js"></script>

    <script src="models/keyboard.class.js"></script>

    <script src="models/level.class.js"></script>

</head>

<body onload="updateMuteButton()">

    <h1>Sharkie</h1>


    <div id="canvas-container">
        <canvas id="canvas" width="720" height="480">
        </canvas>

        <div id="overlay-start-screen" class="canvas-overlay-start start-bg">
            <h2>SHARKIES ADVENTURE</h2>
            <div class="button-start-container">
                <button onclick="startGame()" class="buttons">START</button>
                <button class="buttons">CONTROLS</button>
            </div>
        </div>

        <div id="overlay-boss-dead" class="canvas-overlay game-win-overlay you-win-bg hidden">
            <!-- <img src="x" alt="Game Over"> -->
            <div class="button-container buttons-victory">
                <button onclick="restartGame()" class="buttons">PLAY AGAIN</button>
                <button onclick="goToMenu()" class="buttons">MENU</button>
            </div>
        </div>

        <div id="overlay-player-dead" class="canvas-overlay game-over-overlay hidden">
            <div class="button-container">
                <button onclick="restartGame()" class="buttons">TRY AGAIN</button>
                <button onclick="goToMenu()" class="buttons">MENU</button>
            </div>
            <img class="game-over-title" src="img/6.Botones/Tittles/Game Over/Recurso 12.png" alt="Game Over">
        </div>

        <div class="mute-button-container">
            <button onclick="changeMuteStatus()" id="mute-button" class="mute-button"><img class="volume"
                    src="icons/volume_on.png" alt="Volume on"></button>
            <button onclick="changeMuteStatus()" id="unmute-button" class="mute-button hidden"><img class="volume"
                    src="icons/volume_off.png" alt="Volume off"></button>
        </div>

        <div id="mobile-controls" class="panel-mobile hidden">
            <div class="move-button-mobile">
                <button id="btnUp" class="up"><svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960"
                        width="40px" fill="#000000">

                    </svg></button>

                        width="40px" fill="#000000">
                        <path
                            d="M480-329.33 526.67-376 456-446.67h177.33v-66.66H456L526.67-584 480-630.67 329.33-480 480-329.33ZM480-80q-82.33 0-155.33-31.5-73-31.5-127.34-85.83Q143-251.67 111.5-324.67T80-480q0-83 31.5-156t85.83-127q54.34-54 127.34-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 82.33-31.5 155.33-31.5 73-85.5 127.34Q709-143 636-111.5T480-80Zm0-66.67q139.33 0 236.33-97.33t97-236q0-139.33-97-236.33t-236.33-97q-138.67 0-236 97-97.33 97-97.33 236.33 0 138.67 97.33 236 97.33 97.33 236 97.33ZM480-480Z" />
                    </svg></button>
                <button id="btnRight" class="right"><svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960"
                        width="40px" fill="#000000">
                        <path

                        width="40px" fill="#000000">
                        <path
                            d="m480-328 150.67-150.67L584-525.33l-70.67 70.66V-632h-66.66v177.33L376-525.33l-46.67 46.66L480-328Zm0 248q-82.33 0-155.33-31.5-73-31.5-127.34-85.83Q143-251.67 111.5-324.67T80-480q0-83 31.5-156t85.83-127q54.34-54 127.34-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 82.33-31.5 155.33-31.5 73-85.5 127.34Q709-143 636-111.5T480-80Zm0-66.67q139.33 0 236.33-97.33t97-236q0-139.33-97-236.33t-236.33-97q-138.67 0-236 97-97.33 97-97.33 236.33 0 138.67 97.33 236 97.33 97.33 236 97.33ZM480-480Z" />

            </div>
            <div class="action-button-mobile">
                <button id="btnShoot"><svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px"
                        fill="#000000">
                        <path
                            d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-66.67q139.58 0 236.46-96.87 96.87-96.88 96.87-236.46t-96.87-236.46Q619.58-813.33 480-813.33t-236.46 96.87Q146.67-619.58 146.67-480t96.87 236.46q96.88 96.87 236.46 96.87Zm0-93.33q-100 0-170-70t-70-170q0-100 70-170t170-70q100 0 170 70t70 170q0 100-70 170t-170 70Zm0-66.67q72 0 122.67-50.66Q653.33-408 653.33-480t-50.66-122.67Q552-653.33 480-653.33t-122.67 50.66Q306.67-552 306.67-480t50.66 122.67Q408-306.67 480-306.67Zm0-93.33q-33 0-56.5-23.5T400-480q0-33 23.5-56.5T480-560q33 0 56.5 23.5T560-480q0 33-23.5 56.5T480-400Z" />
                    </svg></button>
            </div>
        </div>

        <div id="rotate-warning" class="rotate-message hidden">
            <img class="rotate-icon" src="icons/mobile_rotate.svg" alt="Rotate Mobile">
            <p>Please rotate your device to play</p>
        </div>
    </div>

</body>

</html>
