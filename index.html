<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
    <link rel="icon" type="image/x-icon" href="icons/favicon-32x32.png">

    <script src="models/audio-manager.class.js"></script>
    <script src="js/audio.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/status-bar.class.js"></script>
    <script src="models/coins.class.js"></script>
    <script src="models/poison.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/pufferfish.class.js"></script>
    <script src="models/jellyfish.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/shootable.object.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>

</head>

<body onload="updateMuteButton()"> 

    <h1>Sharkie</h1>


    <div id="canvas-container">
        <canvas id="canvas" width="720" height="480">
        </canvas>

        <div id="overlay-start-screen" class="canvas-overlay-start start-bg">
            <h2>SHARKIES ADVENTURE</h2>
            <div class="button-start-container">
                <button onclick="startGame()" class="buttons">START</button>
                <button class="buttons">CONTROLS</button>
            </div>
        </div>

        <div id="overlay-boss-dead" class="canvas-overlay you-win-bg hidden">
            <!-- <img src="x" alt="Game Over"> -->
            <div class="button-container">
                <button onclick="restartGame()" class="buttons">PLAY AGAIN</button>
                <button onclick="goToMenu()" class="buttons">MENU</button>
            </div>
        </div>

        <div id="overlay-player-dead" class="canvas-overlay game-over-overlay hidden">
            <div class="button-container">
                <button onclick="restartGame()" class="buttons">TRY AGAIN</button>
                <button onclick="goToMenu()" class="buttons">MENU</button>
            </div>
            <img class="game-over-title" src="img/6.Botones/Tittles/Game Over/Recurso 12.png" alt="Game Over">
        </div>

        <div class="mute-button-container">
            <button onclick="changeMuteStatus()" id="mute-button" class="mute-button"><img class="volume" src="icons/volume_on.png" alt="Volume on"></button>
            <button onclick="changeMuteStatus()" id="unmute-button" class="mute-button hidden"><img class="volume" src="icons/volume_off.png" alt="Volume off"></button>
        </div>
    </div>

</body>

</html>
